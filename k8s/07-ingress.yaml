apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reliefgrid-ingress
  namespace: reliefgrid
  annotations:
    # NGINX ingress controller path rewriting configuration
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
