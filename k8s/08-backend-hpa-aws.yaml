apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: reliefgrid
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  # Minimum replicas running under baseline load
  minReplicas: 2
  # AWS t3.small (2GB RAM) capacity ceiling: maxReplicas=3 guarantees zero OOM-kills while demonstrating HPA scaling (2 -> 3 -> 2)
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15
