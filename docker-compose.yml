services:
  postgres:
    image: postgres:16-alpine
    container_name: reliefgrid-postgres
    environment:
      POSTGRES_USER: reliefuser
      POSTGRES_PASSWORD: reliefpassword
      POSTGRES_DB: reliefgrid
    ports:
      - "5432:5432"
    # Keep PostgreSQL data outside the container filesystem so database survives container recreation
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliefuser -d reliefgrid"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reliefgrid-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reliefgrid-backend
    environment:
      DATABASE_URL: postgresql://reliefuser:reliefpassword@postgres:5432/reliefgrid
      REDIS_URL: redis://redis:6379/0
      API_PREFIX: /api/v1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: reliefgrid-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
