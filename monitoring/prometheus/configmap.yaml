apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: reliefgrid
data:
  prometheus.yml: |
    global:
      # Keep scrape interval at 15s to capture HPA auto-scaling trends without excessive overhead
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # 1. Prometheus Self-Monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # 2. Dynamic ReliefGrid Backend Replica Scraping
      # Dynamically discovers all running backend pods in 'reliefgrid' namespace on port 8000
      - job_name: 'reliefgrid-backend'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - reliefgrid
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: backend
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod_name

      # 3. Kube-State-Metrics Scraping for Deployment and HPA Replica States
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.reliefgrid.svc.cluster.local:8080']
