apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: reliefgrid
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # 1. Prometheus Self-Monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # 2. Dynamic ReliefGrid Backend Replica Scraping
      - job_name: 'reliefgrid-backend'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - reliefgrid
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: backend
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

      # 3. Kube-State-Metrics Scraping
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.reliefgrid.svc.cluster.local:8080']

      # 4. Kubelet cAdvisor Container Metrics via Kubernetes API Proxy (Strict ServiceAccount TLS)
      - job_name: 'kubelet-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      # 5. Node Exporter Host Metrics
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter.reliefgrid.svc.cluster.local:9100']
