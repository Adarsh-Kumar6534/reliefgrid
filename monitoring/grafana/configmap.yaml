apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: reliefgrid
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.reliefgrid.svc.cluster.local:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: reliefgrid
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'ReliefGrid Dashboards'
        orgId: 1
        folder: 'ReliefGrid Operations'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 15
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
